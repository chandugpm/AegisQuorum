# Deliberately a private service: Render must not create a public node-administration endpoint.
# Provision a persistent disk and secrets through the Render dashboard before applying.
services:
  - type: pserv
    name: danms-security-mvp-private
    runtime: node
    plan: starter
    buildCommand: npm ci --ignore-scripts
    startCommand: node src/launch-local.js
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUNTIME_DIRECTORY
        value: /var/data/runtime
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: PORT
        value: "7000"
      - key: DASHBOARD_ADMIN_TOKEN
        sync: false
      - key: NODE_SERVICE_TOKEN
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: BASETEN_API_KEY
        sync: false
      - key: META_MODEL_ID
        value: muse-spark-1.3
    disk:
      name: danms-state
      mountPath: /var/data
      sizeGB: 1
