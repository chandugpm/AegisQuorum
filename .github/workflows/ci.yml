name: Security MVP CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check src/core.js
      - run: node --check src/dashboard.js
      - run: node --check src/node-service.js
      - run: node --check src/verify-audit.js
      - run: npm run verify-audit -- --help || true
      - name: Build container
        run: docker build --tag danms-security-mvp:ci .
