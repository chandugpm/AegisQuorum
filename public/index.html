<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DANMS Security MVP</title><style>body{font:16px system-ui;background:#0b1020;color:#e7edf9;max-width:1100px;margin:auto;padding:2rem}h1{margin-bottom:.2rem}.note{color:#afbdd5}.toolbar{display:flex;gap:.7rem;flex-wrap:wrap;margin:1.5rem 0}input,button{padding:.7rem;border-radius:.4rem;border:1px solid #52617c}input{background:#121b30;color:#fff;min-width:310px}button{cursor:pointer;background:#4f8cff;color:#fff;font-weight:700}button.warn{background:#bd714a}.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}.card{background:#121b30;border-left:5px solid #47c88d;padding:1rem;border-radius:.5rem}.card.quarantined,.card.safe-mode{border-color:#ef6c6c}.card.offline{border-color:#888}code,pre{background:#070b16;padding:.8rem;border-radius:.4rem;overflow:auto;display:block}.flow{margin-top:1.5rem;background:#121b30;padding:1rem;border-radius:.5rem}small{color:#afbdd5}</style></head><body>
<h1>Decentralized Network Management &amp; Security</h1><p class="note">Local-only MVP. Three independent nodes expose signed state, integrity status, and verified recovery evidence.</p>
<div class="toolbar"><input id="token" type="password" placeholder="Local dashboard administrator token"><button onclick="policy()">Apply 2-of-3 policy</button><button class="warn" onclick="demo()">Run tamper → recover demo</button><button onclick="load()">Refresh</button></div>
<p id="message" class="note">Awaiting live node status.</p><section id="nodes" class="nodes"></section><section class="flow"><strong>Workflow evidence</strong><pre id="output">No action has run.</pre></section>
<script>
const out=x=>document.querySelector('#output').textContent=JSON.stringify(x,null,2);const message=x=>document.querySelector('#message').textContent=x;
async function call(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-dashboard-admin-token':token.value},body:JSON.stringify(body||{})});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
function render(nodes){document.querySelector('#nodes').innerHTML=nodes.map(n=>`<article class="card ${n.mode}"><h2>${n.name}</h2><p><b>Mode:</b> ${n.mode}</p><p><b>Quarantined:</b> ${n.quarantined}</p><p><b>Policy sequence:</b> ${n.lastPolicySequence}</p><p><b>Audit:</b> ${n.audit?.valid?'verified':'INVALID'} (${n.audit?.entries??0} entries)</p><small>Identity ${n.nodePublicKeyFingerprint||n.error||''}<br>Digest ${(n.currentDigest||'').slice(0,20)}…</small></article>`).join('')}
async function load(){try{const r=await fetch('/api/status');const j=await r.json();render(j.nodes);message('Live status fetched '+new Date().toLocaleTimeString())}catch(e){message('Status failed: '+e.message)}}
async function policy(){try{const j=await call('/api/policy',{payload:{enforcement:'observe-only',changeWindow:'local-demo'}});out(j);message('Signed 2-of-3 policy submitted to all nodes.');await load()}catch(e){message('Policy rejected: '+e.message)}}
async function demo(){try{const j=await call('/api/demo');out(j);message('Demo completed: tamper, SHA-256 detection, simulated quarantine, and verified rollback.');render(j.nodes)}catch(e){message('Demo failed: '+e.message)}}load();setInterval(load,5000);
</script></body></html>
