services:
  initialize:
    build: .
    command: ["node", "src/initialize.js"]
    environment:
      RUNTIME_DIRECTORY: /app/.runtime
    volumes: ["security-state:/app/.runtime"]
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  node-a: &node
    build: .
    command: ["node", "src/node-service.js"]
    depends_on: { initialize: { condition: service_completed_successfully } }
    environment: &node-env
      NODE_DATA_DIR: /app/.runtime/nodes/node-a
      NODE_NAME: node-a
      AUTHORITY_FILE: /app/.runtime/authority-trust.json
      PORT: 7101
      HOST: 0.0.0.0
      NODE_SERVICE_TOKEN: ${NODE_SERVICE_TOKEN:?set NODE_SERVICE_TOKEN in .env}
    volumes: ["security-state:/app/.runtime"]
    networks: [security-internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:7101/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  node-b:
    <<: *node
    environment:
      <<: *node-env
      NODE_DATA_DIR: /app/.runtime/nodes/node-b
      NODE_NAME: node-b
      PORT: 7102
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:7102/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]

  node-c:
    <<: *node
    environment:
      <<: *node-env
      NODE_DATA_DIR: /app/.runtime/nodes/node-c
      NODE_NAME: node-c
      PORT: 7103
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:7103/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]

  dashboard:
    build: .
    command: ["node", "src/dashboard.js"]
    depends_on:
      initialize: { condition: service_completed_successfully }
      node-a: { condition: service_started }
      node-b: { condition: service_started }
      node-c: { condition: service_started }
    environment:
      PORT: 7000
      HOST: 0.0.0.0
      NODE_URLS: http://node-a:7101,http://node-b:7102,http://node-c:7103
      AUTHORITY_TRUST_FILE: /app/.runtime/authority-trust.json
      NODE_SERVICE_TOKEN: ${NODE_SERVICE_TOKEN:?set NODE_SERVICE_TOKEN in .env}
      DASHBOARD_ADMIN_TOKEN: ${DASHBOARD_ADMIN_TOKEN:?set DASHBOARD_ADMIN_TOKEN in .env}
      DASHBOARD_OPERATOR_TOKEN: ${DASHBOARD_OPERATOR_TOKEN:?set DASHBOARD_OPERATOR_TOKEN in .env}
      POLICY_QUORUM: ${POLICY_QUORUM:-2}
    volumes: ["security-state:/app/.runtime:ro"]
    networks:
      - security-internal
      - default
    ports: ["127.0.0.1:7000:7000"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:7000/api/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  security-internal:
    internal: true
volumes:
  security-state:
